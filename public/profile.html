<!DOCTYPE html>
<html>
<head>
<title>Resident Profile</title>

<style>

/* GLOBAL */
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background: radial-gradient(circle at top, #eef2f7, #dfe7f3);
}

/* CONTAINER */
.profile-container{
max-width:1100px;
margin:auto;
padding:30px;
}

/* HERO HEADER */
.profile-header{
display:flex;
justify-content:space-between;
align-items:center;
background:linear-gradient(135deg,#2f3b63,#1f2a44);
color:white;
padding:25px 30px;
border-radius:18px;
margin-bottom:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.profile-header h1{
margin:0;
font-size:26px;
}

.profile-header button{
margin-left:10px;
padding:10px 16px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

/* BUTTON STYLES */
.profile-header button:first-child{
background:rgba(255,255,255,0.2);
color:white;
}

.profile-header button:first-child:hover{
background:white;
color:#1f2a44;
}

.edit-btn{
background:#4CAF50;
color:white;
}

.edit-btn:hover{
background:#3a9e40;
transform:translateY(-2px);
}

/* CARD */
.profile-card{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
transition:0.3s;
}

.profile-card:hover{
transform:translateY(-3px);
}

/* TITLE */
.profile-card h3{
margin-bottom:15px;
color:#1f2a44;
}

/* INFO GRID */
.info-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

.info-item{
background:#f8fafc;
padding:12px;
border-radius:10px;
font-size:14px;
transition:0.2s;
}

.info-item:hover{
background:#eef2f7;
}

/* FAMILY CARDS */
.family-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.family-card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.06);
transition:0.25s;
}

.family-card:hover{
transform:translateY(-4px) scale(1.02);
box-shadow:0 10px 20px rgba(0,0,0,0.12);
}

.family-card b{
display:block;
font-size:15px;
margin-bottom:5px;
}

/* EMPTY */
.empty{
text-align:center;
color:#888;
padding:20px;
}

/* RESPONSIVE */
@media(max-width:600px){
.profile-header{
flex-direction:column;
align-items:flex-start;
gap:10px;
}
}

</style>

</head>

<body>

<div class="profile-container">

    <!-- HEADER -->
    <div class="profile-header">
        <h1 id="fullName">Loading...</h1>
        <div>
            <button onclick="goBack()">⬅ Back</button>
            <button onclick="editProfile()" class="edit-btn">Edit</button>
        </div>
    </div>

    <!-- USER INFO -->
    <div class="profile-card">
        <h3>USER INFORMATION</h3>
        <div id="userInfo" class="info-grid"></div>
    </div>

    <!-- CONTACT -->
    <div class="profile-card">
        <h3>CONTACT INFORMATION</h3>
        <div id="contactInfo" class="info-grid"></div>
    </div>

    <!-- FAMILY -->
    <div class="profile-card">
        <h3>FAMILY MEMBERS</h3>
        <div id="familyList" class="family-list"></div>
    </div>

</div>

<script>
const token = localStorage.getItem("token");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadProfile() {
    const res = await fetch(`http://localhost:5000/residents/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    if (!res.ok) return;

    const resident = await res.json();
    const head = resident.head || {};

    let fullName = "";

    if (head.firstName || head.middleName || head.lastName) {
        fullName = [head.firstName, head.middleName, head.lastName].filter(n => n).join(" ");
    } else if (head.name) {
        fullName = head.name;
    } else {
        fullName = "No name available";
    }

    document.getElementById("fullName").innerText = fullName;

    document.getElementById("userInfo").innerHTML = `
        <div class="info-item"><b>Age</b> ${head.age || "-"}</div>
        <div class="info-item"><b>Gender</b> ${head.gender || "-"}</div>
        <div class="info-item"><b>Civil Status</b> ${head.civilStatus || "-"}</div>
        <div class="info-item"><b>Birthdate</b> ${head.birthdate ? new Date(head.birthdate).toLocaleDateString() : "-"}</div>
        <div class="info-item"><b>Occupation</b> ${head.occupation || "-"}</div>
    `;

    document.getElementById("contactInfo").innerHTML = `
        <div class="info-item"><b>Contact</b> ${head.contact || "-"}</div>
        <div class="info-item"><b>Email</b> ${head.email || "-"}</div>
    `;

    document.getElementById("familyList").innerHTML =
        (resident.familyMembers || []).length > 0
        ? resident.familyMembers.map(m => `
            <div class="family-card">
                <b>${m.name}</b>
                <p>${m.relation}</p>
                <p>Age: ${m.age || "-"}</p>
                <p>${m.occupation || "-"}</p>
            </div>
        `).join("")
        : `<div class="empty">No family members</div>`;
}

function goBack() {
    const sitioId = localStorage.getItem("sitioId");
    if (sitioId) {
        window.location.href = `sitio.html?sitio=${sitioId}`;
    } else {
        window.history.back();
    }
}

function editProfile() {
    window.location.href = `editResident.html?id=${id}`;
}

loadProfile();
</script>

</body>
</html>
