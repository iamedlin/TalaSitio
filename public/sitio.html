<!DOCTYPE html>
<html>
<head>
    <title>Sitio</title>
    <link rel="stylesheet" href="style2.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
    <h2>TalaSitio</h2>

    <div class="sitio-buttons">
        <button onclick="goSitio(1)">Sitio 1</button>
        <button onclick="goSitio(2)">Sitio 2</button>
        <button onclick="goSitio(3)">Sitio 3</button>
        <button onclick="goSitio(4)">Sitio 4</button>
        <button onclick="goSitio(5)">Sitio 5</button>
    </div>
</div>

<div class="main">

    <div class="top-bar">
        <h1 id="sitioTitle">Sitio</h1>

        <div style="display:flex; gap:10px;">
            <button onclick="goAddResident()">+ Add Resident</button>
            <button onclick="goBack()">⬅ Exit</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Population</h4>
            <h2 id="totalPopulation">0</h2>
        </div>

        <div class="stat-card">
            <h4>Senior Citizens</h4>
            <h2 id="seniorCount">0</h2>
        </div>

        <div class="stat-card">
            <h4>Unemployed</h4>
            <h2 id="unemployedCount">0</h2>
        </div>

        <div class="stat-card">
            <h4>Out of School</h4>
            <h2 id="outOfSchool">0</h2>
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="card">
            <h2>Residents</h2>
            <div id="residentList"></div>
        </div>

        <div class="card">
            <h2>Population Chart</h2>
            <canvas id="chartCanvas"></canvas>
        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");

/* ✅ FIX: declare chart */
let chart = null;

/* ======================
   GET / SAVE SITIO
====================== */
const params = new URLSearchParams(window.location.search);
const sitioFromUrl = params.get("sitio");

if (sitioFromUrl) {
    localStorage.setItem("sitioId", sitioFromUrl);
}

let sitioId = Number(localStorage.getItem("sitioId"));

if (!sitioId) {
    sitioId = 1;
    localStorage.setItem("sitioId", sitioId);
}

document.getElementById("sitioTitle").innerText = "Sitio " + sitioId;

/* ======================
   NAVIGATION
====================== */
function goSitio(id){
    localStorage.setItem("sitioId", id);
    window.location.href = `sitio.html?sitio=${id}`;
}

function goBack(){
    window.location.href = "adminDashboard.html";
}

function goAddResident(){
    window.location.href = "addResident.html";
}

function viewProfile(id){
    window.location.href = `profile.html?id=${id}`;
}

/* ======================
   CHART
====================== */
function renderChart(residents){

    const ageGroups = {
        "0-17": 0,
        "18-35": 0,
        "36-60": 0,
        "60+": 0
    };

    residents.forEach(r => {

        if (r.head?.age != null) {
            const age = r.head.age;

            if(age <= 17) ageGroups["0-17"]++;
            else if(age <= 35) ageGroups["18-35"]++;
            else if(age <= 60) ageGroups["36-60"]++;
            else ageGroups["60+"]++;
        }

        r.familyMembers?.forEach(m => {

            if(m.age == null) return;

            const age = m.age;

            if(age <= 17) ageGroups["0-17"]++;
            else if(age <= 35) ageGroups["18-35"]++;
            else if(age <= 60) ageGroups["36-60"]++;
            else ageGroups["60+"]++;
        });

    });

    const ctx = document.getElementById("chartCanvas");

    if(chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: Object.keys(ageGroups),
            datasets: [{
                data: Object.values(ageGroups)
            }]
        }
    });
}

/* ======================
   LOAD RESIDENTS
====================== */
async function loadResidents(){

    const container = document.getElementById("residentList");
    container.innerHTML = "Loading...";

    try {

        const res = await fetch(`http://localhost:5000/residents/sitio/${sitioId}`, {
            headers: { 
                "Authorization": `Bearer ${token}` 
            }
        });

        const residents = await res.json();

        let totalPopulation = 0;
        let seniorCount = 0;
        let unemployedCount = 0;
        let outOfSchool = 0;

        residents.forEach(r => {

            if (r.head) {
                totalPopulation++;

                const age = r.head.age;

                if (age >= 60) seniorCount++;

                if (!r.head.occupation || r.head.occupation.trim() === "") {
                    unemployedCount++;

                    if (age >= 6 && age <= 24) {
                        outOfSchool++;
                    }
                }
            }

            r.familyMembers?.forEach(m => {

                totalPopulation++;

                const age = m.age;

                if (age >= 60) seniorCount++;

                if (!m.occupation || m.occupation.trim() === "") {
                    unemployedCount++;

                    if (age >= 6 && age <= 24) {
                        outOfSchool++;
                    }
                }
            });

        });

        document.getElementById("totalPopulation").innerText = totalPopulation;
        document.getElementById("seniorCount").innerText = seniorCount;
        document.getElementById("unemployedCount").innerText = unemployedCount;
        document.getElementById("outOfSchool").innerText = outOfSchool;

        renderChart(residents);

        container.innerHTML = "";

        if (!residents.length) {
            container.innerHTML = "<p>No residents found</p>";
            return;
        }

        residents.forEach(res => {

            const div = document.createElement("div");

            div.innerHTML = `
                <h3>${res.head?.name || "No Name"}</h3>
                <p>Age: ${res.head?.age || "N/A"}</p>
                <p>Family: ${res.familyMembers?.length || 0}</p>

                <button onclick="viewProfile('${res._id}')">View Family</button>
                <button onclick="deleteResident('${res._id}')">Remove</button>
            `;

            container.appendChild(div);
        });

    } catch(err){
        console.error(err);
        container.innerHTML = "<p>Error loading data</p>";
    }
}

/* ======================
   DELETE
====================== */
async function deleteResident(id){

    if(!confirm("Delete this resident?")) return;

    await fetch(`http://localhost:5000/residents/${id}`, {
        method: "DELETE",
        headers: { 
            "Authorization": `Bearer ${token}` 
        }
    });

    loadResidents();
}

/* INIT */
loadResidents();

</script>

</body>
</html>
