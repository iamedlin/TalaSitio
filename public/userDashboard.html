<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}
.profile-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.profile-card{
    background:white;
    padding:20px;
    border-radius:8px;
    margin-bottom:20px;
}
.header{
background:#2c7be5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

.resident-card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border:1px solid #ddd;
}

button{
padding:10px;
background:red;
border:none;
color:white;
cursor:pointer;
}

.input-group {
    position: relative;
}

.input-group input {
    width: 100%;
    padding: 12px;
    padding-right: 40px; /* space for icon */
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.input-group span {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
}

</style>

</head>

<body>

<div class="header">

<h2>TalaSitio Resident Portal</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">
    <h3>Loading...</h3>
    <p>Please wait...</p>
</div>
<div id="passwordSection" class="password-card" style="display: none;">
    <h3>Change Password</h3>

    <div class="input-group">
        <input type="password" id="currentPassword" placeholder="Current Password">
        <span onclick="togglePassword('currentPassword', this)">👁️</span>
    </div>

    <div class="input-group">
        <input type="password" id="newPassword" placeholder="New Password">
        <span onclick="togglePassword('newPassword', this)">👁️</span>
    </div>

    <button onclick="changePassword()">Update Password</button>
</div>

<script>
const token = localStorage.getItem("token");

// Redirect to login if no token
if (!token) {
    window.location.href = "login.html";
}

// Logout function
function logout() {
    if (confirm("Do you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }
}
function requestEdit(residentId) {
    const newName = prompt("Enter new name:");

    if (!newName) return; // Cancel pressed

    fetch("http://localhost:5000/edit-request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            residentId,
            newData: {
                $set: { "head.name": newName } // Use $set for nested update
            }
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
    })
    .catch(err => console.error(err));
}
function goToEdit(){
    window.location.href = "edit.html";
}
// Fetch current user info
async function getCurrentUser() {
    try {
        // 1. Get logged in user
        const res = await fetch("http://localhost:5000/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) {
            const data = await res.json();
            alert(data.message || "Session expired.");
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        const user = await res.json();

        // 2. Fetch resident using email
        const residentRes = await fetch(`http://localhost:5000/residents/by-email/${user.email}`);
        const resident = await residentRes.json();

        // 3. DISPLAY DATA
       document.querySelector(".card").innerHTML = `
    <div class="profile-header">
        <h2>${resident.head.name}</h2>
    </div>

    <!-- USER INFO -->
    <div class="profile-card">
        <h3>USER INFORMATION</h3>
        <p><b>Age:</b> ${resident.head.age || "-"}</p>
        <p><b>Gender:</b> ${resident.head.gender || "-"}</p>
        <p><b>Civil Status:</b> ${resident.head.civilStatus || "-"}</p>
        <p><b>Birthdate:</b> ${
            resident.head.birthdate 
            ? new Date(resident.head.birthdate).toLocaleDateString() 
            : "-"
        }</p>
        <p><b>Occupation:</b> ${resident.head.occupation || "-"}</p>
    </div>

    <!-- CONTACT -->
    <div class="profile-card">
        <h3>CONTACT INFORMATION</h3>
        <p><b>Contact:</b> ${resident.head.contact || "-"}</p>
        <p><b>Email:</b> ${resident.head.email || "-"}</p>
    </div>

    <!-- FAMILY -->
    <div class="profile-card">
        <h3>FAMILY MEMBERS</h3>
        ${
            resident.familyMembers.length > 0
            ? resident.familyMembers.map(member => `
                <div class="resident-card">
                    <p><b>Name:</b> ${member.name}</p>
                    <p><b>Relation:</b> ${member.relation}</p>
                    <p><b>Age:</b> ${member.age || "-"}</p>
                    <p><b>Occupation:</b> ${member.occupation || "-"}</p>
                </div>
            `).join("")
            : "<p>No family members</p>"
        }
    </div>

    <br>
    <button onclick="goToEdit()">Edit Info</button>
    <button onclick="toggleChangePassword()">Change Password</button>
`;

    } catch (err) {
        console.error(err);
        alert("Error loading user data");
    }
}
getCurrentUser();

async function changePassword() {
    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;

    if (!currentPassword || !newPassword) {
        alert("Please fill all fields");
        return;
    }

    try {
        const res = await fetch("http://localhost:5000/api/auth/change-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                currentPassword,
                newPassword
            })
        });

        const data = await res.json();
        alert(data.message);

        if (res.ok) {
            document.getElementById("currentPassword").value = "";
            document.getElementById("newPassword").value = "";
        }

    } catch (err) {
        console.error(err);
        alert("Error changing password");
    }
}
function togglePassword(inputId, el) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        el.textContent = "🙈";
    } else {
        input.type = "password";
        el.textContent = "👁️";
    }
}
function toggleChangePassword() {
    const section = document.getElementById("passwordSection");

    if (section.style.display === "none") {
        section.style.display = "block";
    } else {
        section.style.display = "none";
    }
}

</script>
</body>
</html>
