<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:#2c7be5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

.resident-card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border:1px solid #ddd;
}

button{
padding:10px;
background:red;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>TalaSitio Resident Portal</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">

<h3>Welcome Resident</h3>

<p>You are logged in.</p>

</div>

<h2>Residents</h2>

<div id="residentList"></div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href="login.html";
}

function logout(){

    const confirmLogout = confirm("Do you want to log out?");

    if(confirmLogout){
        localStorage.removeItem("token");
        window.location.href="login.html";
    }

}

async function selectSitio(number){
    try {
        const response = await fetch(`http://localhost:5000/residents/sitio/${number}`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const residents = await response.json();

        const container = document.getElementById("residentList");
        container.innerHTML = "";

        if(residents.length === 0){
            container.innerHTML = "<p>No residents found.</p>";
            return;
        }

        residents.forEach(res => {
            const div = document.createElement("div");
            div.classList.add("resident-card");

            div.innerHTML = `
                <p><strong>Name:</strong> ${res.name}</p>
                <p><strong>Age:</strong> ${res.age}</p>
                <p><strong>Sitio:</strong> ${res.sitio}</p>
            `;

            container.appendChild(div);
        });

    } catch (error) {
        console.error("Error fetching residents:", error);
    }
}

</script>

</body>
</html>
