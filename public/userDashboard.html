<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:#2c7be5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

.resident-card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border:1px solid #ddd;
}

button{
padding:10px;
background:red;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>TalaSitio Resident Portal</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">
    <h3>Loading...</h3>
    <p>Please wait...</p>

    <button onclick="openEditForm()">Edit Profile</button>
</div>

<!-- Hidden Edit Form -->
<div id="editForm" style="display:none;" class="card">
    <h3>Edit Profile</h3>

    <input type="text" id="editName" placeholder="Name"><br><br>
    <input type="email" id="editEmail" placeholder="Email"><br><br>

    <button onclick="submitEdit()">Submit Request</button>
</div>

<script>
const token = localStorage.getItem("token");

// Redirect to login if no token
if (!token) {
    window.location.href = "login.html";
}

// Logout function
function logout() {
    if (confirm("Do you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }
}

function openEditForm() {
    document.getElementById("editForm").style.display = "block";
}

async function submitEdit() {
    const name = document.getElementById("editName").value;
    const email = document.getElementById("editEmail").value;

    const res = await fetch("http://localhost:5000/api/edit-request", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            name,
            email
        })
    });

    const data = await res.json();
    alert(data.message);
}

let currentUser = null;

async function getCurrentUser() {
    try {
        const res = await fetch("http://localhost:5000/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) {
            const data = await res.json();
            alert(data.message || "Session expired.");
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        const user = await res.json();
        currentUser = user;

        document.querySelector(".card h3").textContent = `Welcome, ${user.name}`;
        document.querySelector(".card p").textContent = `You are logged in as ${user.email}`;

        // Prefill edit form
        document.getElementById("editName").value = user.name;
        document.getElementById("editEmail").value = user.email;

    } catch (err) {
        console.error(err);
    }
}

async function getNotifications() {
    const res = await fetch("http://localhost:5000/api/notifications", {
        headers: { Authorization: `Bearer ${token}` }
    });

    const data = await res.json();
    console.log(data);
}
</script>
</body>
</html>
