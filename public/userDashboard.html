<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:#2c7be5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

.resident-card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border:1px solid #ddd;
}

button{
padding:10px;
background:red;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>TalaSitio Resident Portal</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">
    <h3>Loading...</h3>
    <p>Please wait...</p>
</div>

<script>
const token = localStorage.getItem("token");

// Redirect to login if no token
if (!token) {
    window.location.href = "login.html";
}

// Logout function
function logout() {
    if (confirm("Do you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }
}
function requestEdit(residentId) {
    const newName = prompt("Enter new name:");

    if (!newName) return; // Cancel pressed

    fetch("http://localhost:5000/edit-request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            residentId,
            newData: {
                $set: { "head.name": newName } // Use $set for nested update
            }
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
    })
    .catch(err => console.error(err));
}

// Fetch current user info
async function getCurrentUser() {
    try {
        // 1. Get logged in user
        const res = await fetch("http://localhost:5000/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) {
            const data = await res.json();
            alert(data.message || "Session expired.");
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        const user = await res.json();

        // 2. Fetch resident using email
        const residentRes = await fetch(`http://localhost:5000/residents/by-email/${user.email}`);
        const resident = await residentRes.json();

        // 3. DISPLAY DATA
        document.querySelector(".card").innerHTML = `
            <h3>${resident.head.name}</h3>
            <p>Email: ${resident.head.email}</p>
            <p>Birthdate: ${resident.head.birthdate}</p>

            <h4>Family Members:</h4>
            ${resident.familyMembers.map(member => `
                <div class="resident-card">
                    <p><b>${member.name}</b></p>
                    <p>${member.birthdate}</p>
                </div>
            `).join("")}

            <br>
            <button onclick="requestEdit('${resident._id}')">Edit Info</button>
        `;

    } catch (err) {
        console.error(err);
        alert("Error loading user data");
    }
}
getCurrentUser();
</script>
</body>
</html>
