<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

.header{
background:#2c7be5;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
}

.container{
padding:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

.resident-card{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border:1px solid #ddd;
}

button{
padding:10px;
background:red;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>TalaSitio Resident Portal</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">
    <h3>Loading...</h3>
    <p>Please wait...</p>
</div>

<script>
const token = localStorage.getItem("token");

// Redirect to login if no token
if (!token) {
    window.location.href = "login.html";
}

// Logout function
function logout() {
    if (confirm("Do you want to log out?")) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
    }
}

// Fetch current user info
async function getCurrentUser() {
    try {
        const res = await fetch("http://localhost:5000/api/auth/me", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        // If token expired or invalid
        if (!res.ok) {
            const data = await res.json();
            alert(data.message || "Session expired. Please login again.");
            localStorage.removeItem("token");
            window.location.href = "login.html";
            return;
        }

        // Successful fetch
        const user = await res.json();
        document.querySelector(".card h3").textContent = `Welcome, ${user.name}`;
        document.querySelector(".card p").textContent = `You are logged in as ${user.email}`;

    } catch (err) {
        console.error("Error fetching user:", err);
        alert("Server error. Please refresh or login again.");
    }
}

// Run on page load
getCurrentUser();
</script>
</body>
</html>
