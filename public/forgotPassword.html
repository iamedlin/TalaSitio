<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

/* BACKGROUND */
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0d47a1, #42a5f5);
}

/* MAIN CARD */
.box {
    width: 360px;
    padding: 30px;
    border-radius: 16px;

    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    color: white;

    animation: fadeIn 0.6s ease;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* STEP INDICATOR */
.steps {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.step-dot {
    width: 100%;
    height: 4px;
    margin: 0 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 5px;
}

.step-dot.active {
    background: white;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;

    border: none;
    border-radius: 8px;

    outline: none;
    font-size: 14px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;

    background: #0d47a1;
    color: white;

    border: none;
    border-radius: 8px;

    cursor: pointer;
    font-weight: bold;

    transition: 0.3s;
}

button:hover {
    background: #08306b;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

/* MESSAGE */
.msg {
    font-size: 13px;
    margin-bottom: 10px;
    display: none;
}

.error { color: #ff6b6b; }
.success { color: #00e676; }

/* PASSWORD HINT */
.hint {
    font-size: 12px;
    opacity: 0.8;
    margin-bottom: 10px;
}

/* HIDDEN */
.hidden {
    display: none;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="box">
    <h2>Reset Password</h2>

    <!-- STEPS -->
    <div class="steps">
        <div class="step-dot active" id="stepDot1"></div>
        <div class="step-dot" id="stepDot2"></div>
    </div>

    <!-- STEP 1 -->
    <div id="step1">
        <input type="email" id="email" placeholder="Enter your email">
        <div id="step1-msg" class="msg error"></div>
        <button id="sendBtn" onclick="sendCode()">Send Code</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="hidden">
        <input type="text" id="code" placeholder="Verification Code">
        <input type="password" id="newPassword" placeholder="New Password">

        <div class="hint">Use a strong password (8+ characters)</div>

        <div id="step2-msg" class="msg error"></div>
        <button id="resetBtn" onclick="resetPassword()">Reset Password</button>
    </div>
</div>

<script>

const SERVER_URL = "http://localhost:5000";

/* UI HELPERS */
function showError(id, message){
    const el = document.getElementById(id);
    el.textContent = message;
    el.style.display = "block";
}

function clearError(id){
    const el = document.getElementById(id);
    el.textContent = "";
    el.style.display = "none";
}

/* STEP NAVIGATION */
function goToStep2(){
    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");

    document.getElementById("stepDot1").classList.remove("active");
    document.getElementById("stepDot2").classList.add("active");
}

/* SEND CODE */
async function sendCode() {
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("sendBtn");

    clearError("step1-msg");

    if(!email){
        showError("step1-msg", "Email is required");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const res = await fetch(`${SERVER_URL}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if(res.ok){
            alert("Code sent to your email!");
            goToStep2();
        } else {
            showError("step1-msg", data.message || "Failed to send code");
        }

    } catch(err){
        console.error(err);
        showError("step1-msg", "Server error");
    }

    btn.disabled = false;
    btn.textContent = "Send Code";
}

/* RESET PASSWORD */
async function resetPassword() {
    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();

    const btn = document.getElementById("resetBtn");

    clearError("step2-msg");

    if(!code || !newPassword){
        showError("step2-msg", "All fields are required");
        return;
    }

    if(newPassword.length < 6){
        showError("step2-msg", "Password must be at least 6 characters");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Resetting...";

    try {
        const res = await fetch(`${SERVER_URL}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code, newPassword })
        });

        const data = await res.json();

        if(res.ok){
            alert("Password reset successful!");

            // Reset UI
            document.getElementById("step1").classList.remove("hidden");
            document.getElementById("step2").classList.add("hidden");

            document.getElementById("email").value = "";
            document.getElementById("code").value = "";
            document.getElementById("newPassword").value = "";

            document.getElementById("stepDot1").classList.add("active");
            document.getElementById("stepDot2").classList.remove("active");

        } else {
            showError("step2-msg", data.message || "Reset failed");
        }

    } catch(err){
        console.error(err);
        showError("step2-msg", "Server error");
    }

    btn.disabled = false;
    btn.textContent = "Reset Password";
}

</script>

</body>
</html>
