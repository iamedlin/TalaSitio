<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c7be5;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background: #1a5ac7;
        }

        .hidden {
            display: none;
        }

        .step {
            margin-top: 20px;
        }

        .error {
            color: red;
            font-size: 0.9em;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            font-size: 0.9em;
            margin-top: -5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Reset Password</h3>

    <!-- Step 1: Enter email to send code -->
    <div id="step1" class="step">
        <input type="email" id="email" placeholder="Enter your email">
        <div id="step1-msg" class="error hidden"></div>
        <button onclick="sendCode()">Send Verification Code</button>
    </div>

    <!-- Step 2: Enter code and new password -->
    <div id="step2" class="step hidden">
        <input type="text" id="code" placeholder="Enter verification code">
        <input type="password" id="newPassword" placeholder="New Password">
        <div id="step2-msg" class="error hidden"></div>
        <button onclick="resetPassword()">Reset Password</button>
    </div>
</div>

<script>
const SERVER_URL = "http://localhost:5000"; // your backend URL

async function sendCode() {
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("step1-msg");
    msg.classList.add("hidden");

    if(!email) {
        msg.textContent = "Please enter your email.";
        msg.classList.remove("hidden");
        return;
    }

    try {
        const res = await fetch(`${SERVER_URL}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if(res.ok){
            // move to step 2
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
            alert(data.message);
        } else {
            msg.textContent = data.message || "Failed to send code";
            msg.classList.remove("hidden");
        }

    } catch(err) {
        console.error("Send code error:", err);
        msg.textContent = "Server error. Check console.";
        msg.classList.remove("hidden");
    }
}

async function resetPassword() {
    const email = document.getElementById("email").value.trim();
    const code = document.getElementById("code").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();
    const msg = document.getElementById("step2-msg");
    msg.classList.add("hidden");

    if(!code || !newPassword){
        msg.textContent = "Please fill all fields.";
        msg.classList.remove("hidden");
        return;
    }

    try {
        const res = await fetch(`${SERVER_URL}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, code, newPassword })
        });

        const data = await res.json();

        if(res.ok){
            alert(data.message);
            // reset form
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("step1").classList.remove("hidden");
            document.getElementById("email").value = "";
            document.getElementById("code").value = "";
            document.getElementById("newPassword").value = "";
        } else {
            msg.textContent = data.message || "Failed to reset password";
            msg.classList.remove("hidden");
        }

    } catch(err) {
        console.error("Reset password error:", err);
        msg.textContent = "Server error. Check console.";
        msg.classList.remove("hidden");
    }
}
</script>

</body>
</html>
