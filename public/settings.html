<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - TalaSitio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #eef2f7, #dfe7f3);
  transition: 0.3s;
}

body.dark {
  background: #0f172a;
  color: #e2e8f0;
}

/* LAYOUT */
.layout {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  height: 100vh;
  position: fixed;
  background: #1f2a44;
  padding: 20px;
  color: #fff;
}

.sidebar h2 {
  margin-bottom: 30px;
}

.sidebar a {
  display: block;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  color: #cbd5e1;
  text-decoration: none;
  transition: 0.3s;
}

.sidebar a:hover {
  background: #2f3b63;
  transform: translateX(5px);
}

/* MAIN */
.main {
  margin-left: 250px;
  width: calc(100% - 250px);
  padding: 30px;
}

/* TOPBAR */
.topbar {
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  padding: 15px 20px;
  border-radius: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

body.dark .topbar {
  background: rgba(30,41,59,0.6);
}

/* HEADER */
.header h2 {
  margin: 25px 0;
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}

.actions button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;

  background: linear-gradient(135deg, #1f2a44, #2f3b63);
  color: white;

  transition: 0.3s;
}

.actions button:hover {
  transform: translateY(-3px) scale(1.02);
}

.actions button.active-btn {
  transform: scale(1.05);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* CARD */
.card {
  display: none;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  max-width: 600px;
  margin: auto;

  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s ease;
}

body.dark .card {
  background: rgba(30,41,59,0.7);
}

.card.active {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

/* INPUTS */
.card input,
.card select {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  transition: 0.3s;
}

.card input:focus,
.card select:focus {
  outline: none;
  border-color: #1f2a44;
  box-shadow: 0 0 0 3px rgba(31,42,68,0.2);
}

/* BUTTON */
.card button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #1f2a44;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.card button:hover {
  background: #2f3b63;
  transform: scale(1.03);
}

.card button:disabled {
  background: #666;
  cursor: not-allowed;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 14px 20px;
  border-radius: 10px;
  color: white;
  background: #1f2a44;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.3s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error { background: #dc2626; }
.toast.info { background: #2563eb; }

/* DARK BUTTON */
.toggle {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  background: #1f2a44;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>TalaSitio</h2>
    <a href="adminDashboard.html">Dashboard</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div id="greeting">Hello Admin 👋</div>
      <button class="toggle" onclick="toggleDark()">🌙</button>
    </div>

    <div class="header">
      <h2>Settings</h2>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button onclick="showCard('updateCard')">✏️ Update Info</button>
      <button onclick="showCard('addCard')">➕ Add Account</button>
    </div>

    <!-- UPDATE -->
    <div id="updateCard" class="card">
      <h3>Update My Info</h3>

      <input id="myName" placeholder="Full Name">
      <input id="myEmail" type="email" placeholder="Email">
      <input id="myPassword" type="password" placeholder="New Password">

      <button onclick="updateMyInfo()">Save Changes</button>
    </div>

    <!-- ADD -->
    <div id="addCard" class="card">
      <h3>Create Account</h3>

      <input id="name" placeholder="Full Name">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <select id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <button onclick="createAccount()">Create</button>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
const token = localStorage.getItem("token");
if(!token) window.location.href="login.html";

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* CARD SWITCH */
function hideAllCards(){
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
}

function showCard(id){
  hideAllCards();

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".actions button").forEach(b => b.classList.remove("active-btn"));

  if(id === "updateCard"){
    document.querySelectorAll(".actions button")[0].classList.add("active-btn");
  } else {
    document.querySelectorAll(".actions button")[1].classList.add("active-btn");
  }
}

/* TOAST */
function showToast(msg, type="info"){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = `toast show ${type}`;

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

/* LOAD USER */
async function loadUser(){
  const res = await fetch("http://localhost:5000/api/auth/me", {
    headers: { "Authorization": `Bearer ${token}` }
  });

  const user = await res.json();
  document.getElementById("greeting").textContent = `Hello ${user.name} 👋`;

  document.getElementById("myName").value = user.name;
  document.getElementById("myEmail").value = user.email;
}

loadUser();

/* UPDATE */
async function updateMyInfo(){
  const btn = document.querySelector("#updateCard button");
  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    const res = await fetch("http://localhost:5000/update-me", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({
        name: myName.value,
        email: myEmail.value,
        password: myPassword.value
      })
    });

    const data = await res.json();
    showToast(data.message || "Updated!", "success");

  } catch {
    showToast("Error updating", "error");
  }

  btn.disabled = false;
  btn.textContent = "Save Changes";
}

/* CREATE */
async function createAccount(){
  if(!name.value || !email.value || !password.value){
    showToast("Fill all fields", "error");
    return;
  }

  const res = await fetch("http://localhost:5000/create-user", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      password: password.value,
      role: role.value
    })
  });

  const data = await res.json();
  showToast(data.message || "Account created!", "success");
}
</script>

</body>
</html>
