<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TalaSitio Admin Dashboard</title>

<link rel="stylesheet" href="adminDashboardStyles.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar"> <h2 class="logo-title"> <img src="images/loading.png" alt="Logo"> TalaSitio </h2>
  <a onclick="showSection('dashboard')">📊 Dashboard</a>
  <a href="settings.html">⚙️ Settings</a> 
  <a onclick="openLogoutModal()">🚪 Logout</a>
</div>


<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h2>Admin Panel</h2>
    <div style="display: flex; align-items: center; gap: 20px;">
      👤 <span id="adminDisplay">Admin</span>
      <button class="notification-btn" onclick="toggleRequestsBox()">🔔</button>
    </div>
  </div>

  <!-- REQUEST BOX -->
  <div id="requestBox" class="request-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Account Requests</h3>
      <button style="background:none; border:none; font-size:18px; cursor:pointer;" onclick="closeRequestBox()">✖</button>
    </div>
    <div id="requestList"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="section active">
    <!-- Sitio Buttons -->
    <div class="sitio-container">
      <button class="sitio-btn" onclick="goToSitio(1)">Marlane</button>
      <button class="sitio-btn" onclick="goToSitio(2)">Visayan Village</button>
      <button class="sitio-btn" onclick="goToSitio(3)">Poblacion</button>
      <button class="sitio-btn" onclick="goToSitio(4)">Roga</button>
      <button class="sitio-btn" onclick="goToSitio(5)">Paner</button>
      <button class="sitio-btn" onclick="goToSitio(6)">Pinagpala</button>
    </div>
  </div>
  <!-- SETTINGS -->
  <div id="settings" class="section">
    <h2>Account & System Settings</h2>
    <div class="settings-box">
      <label>Full Name</label>
      <input id="nameInput" type="text" placeholder="Enter new name" />

      <label>Username</label>
      <input id="usernameInput" type="text" placeholder="Enter new username" />

      <label>Email</label>
      <input type="email" placeholder="Enter new email" />

      <label>New Password</label>
      <input type="password" placeholder="Enter new password" />

      <button class="dark-toggle" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>
      <button onclick="saveSettings()">Save Changes</button>
    </div>
  </div>

</div>

<!-- LOGOUT MODAL -->
<div id="logoutModal" class="modal">
  <div class="modal-box">
    <h3>Confirm Logout</h3>
    <p>Are you sure you want to log out?</p>
    <div class="modal-buttons">
      <button class="btn btn-logout" onclick="logout()">Logout</button>
      <button class="btn btn-cancel" onclick="closeLogoutModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SAVE MODAL -->
<div id="saveModal" class="modal">
  <div class="modal-box">
    <h3>Settings Saved ✅</h3>
    <p>Your changes were applied successfully.</p>
    <div class="modal-buttons">
      <button class="btn btn-ok" onclick="closeSaveModal()">OK</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if(!token) window.location.href="login.html";

function showSection(id){
  document.querySelectorAll('.section').forEach(sec=>sec.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function closeRequestBox(){
  document.getElementById("requestBox").style.display = "none";
}

function toggleDarkMode() { document.body.classList.toggle('dark'); }

function toggleDarkMode() { document.body.classList.toggle('dark'); }
function saveSettings(){
  const username = document.getElementById('usernameInput').value;
  if(username) document.getElementById('adminDisplay').textContent = username;
  document.getElementById('saveModal').style.display='flex';
}

function closeSaveModal(){ document.getElementById('saveModal').style.display='none'; }

function openLogoutModal(){ document.getElementById('logoutModal').style.display='flex'; }
function closeLogoutModal(){ document.getElementById('logoutModal').style.display='none'; }

function logout(){
  localStorage.removeItem("token");
  window.location.href="login.html";
}

// Sitio navigation
function goToSitio(number){ 
  window.location.href = `sitio.html?sitio=${number}`; 
}

// Requests Box
function toggleRequestsBox(){
  const box = document.getElementById("requestBox");
  box.style.display = box.style.display==='block' ? 'none':'block';
  if(box.style.display==='block') fetchRequests();
}

// Fetch requests from server
async function fetchRequests(){
  const res = await fetch("http://localhost:5000/edit-requests");
  const data = await res.json();

   const box = document.getElementById("requestBox");

    box.innerHTML = data.map(req => `
        <div class="card">
            <p>Resident ID: ${req.residentId}</p>
            <p>Status: ${req.status}</p>
            <button onclick="approve('${req._id}')">Approve</button>
        </div>
    `).join("");
}

function approveEdit(id) {
    fetch(`http://localhost:5000/edit-request/approve/${id}`, {
        method: "PUT"
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        fetchRequests(); // refresh
    });
}

async function approveRequest(id){
  try {
    await fetch(`http://localhost:5000/approve-request/${id}`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}` }
    });
    fetchRequests();
  } catch (err) {
    console.error("Error approving request:", err);
  }
}

// Toggle request box and fetch requests
function toggleRequestsBox(){
    const box = document.getElementById("requestBox");
    box.style.display = box.style.display==='block' ? 'none':'block';
    if(box.style.display==='block') fetchRequests();
}

// Fetch edit requests
async function fetchRequests(){
    try {
        const response = await fetch("http://localhost:5000/edit-requests");
        const requests = await response.json();

        const list = document.getElementById("requestList");
        list.innerHTML = "";

        requests.forEach(req => {
            const div = document.createElement("div");
            div.innerHTML = `
                <p><b>Resident ID:</b> ${req.residentId}</p>
                <p>Status: ${req.status}</p>
                ${req.status === "pending" ? `<button onclick="approveEdit('${req._id}')">Approve</button>` : `<small>✔ ${req.status}</small>`}
            `;
            list.appendChild(div);
        });
    } catch (err) {
        console.error("Error fetching requests:", err);
    }
}

function approveEdit(id){
  fetch(`http://localhost:5000/edit-request/approve/${id}`, {
    method: "PUT"
  })
  .then(res => res.json())
  .then(() => fetchRequests());
}
</script>

</body>
</html>
