<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Notification button -->
<button class="notification-btn" onclick="toggleRequests()">🔔</button>

<div id="requestBox" class="request-box">
    <h3>Account Requests</h3>
    <div id="requestList"></div>
</div>

<div class="sidebar">
    <h2>TalaSitio</h2>

    <a href="#">Dashboard</a>
    <a href="#">Residents</a>
    <a href="#">Reports</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

    <h1 id="dashboardTitle">Admin Dashboard</h1>
    <p id="welcomeText">Welcome Admin</p>

    <!-- Sitio Buttons -->
    <div class="sitio-container">
        <button class="sitio-btn" onclick="goToSitio(1)">Sitio 1</button>
        <button class="sitio-btn" onclick="goToSitio(2)">Sitio 2</button>
        <button class="sitio-btn" onclick="goToSitio(3)">Sitio 3</button>
        <button class="sitio-btn" onclick="goToSitio(4)">Sitio 4</button>
        <button class="sitio-btn" onclick="goToSitio(5)">Sitio 5</button>
    </div>

    <!-- Dynamic Title -->
    <h2 id="sitioTitle">Residents</h2>

    <div id="sitioHeader" class="sitio-header">
        Select a Sitio
    </div>

    <!-- Residents Display -->
    <div id="residentList" class="resident-grid"></div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href="login.html";
}

function logout(){
    const confirmLogout = confirm("Do you want to log out?");
    if(confirmLogout){
        localStorage.removeItem("token");
        window.location.href="login.html";
    }
}

// ❌ DELETE mo ito kung meron
// function selectSitio(number){    
//     alert("Selected Sitio " + number);
// }

// ✅ ITO ANG ILAGAY MO
function goToSitio(number){
    window.location.href = `sitio${number}.html`;
}

// existing functions mo
function toggleRequests() {
    const box = document.getElementById("requestBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
    if (box.style.display === "block") {
        fetchRequests();
    }
}

async function fetchRequests() {
    try {
        const response = await fetch("http://localhost:5000/account-requests", {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const requests = await response.json();
        const list = document.getElementById("requestList");
        list.innerHTML = "";

        requests.forEach(req => {
            const div = document.createElement("div");
            div.innerHTML = `
                <p>${req.name} - ${req.email}</p>
                <button onclick="approveRequest('${req._id}')">Approve</button>
            `;
            list.appendChild(div);
        });

    } catch (error) {
        console.error("Error fetching requests:", error);
    }
}

async function approveRequest(id) {
    try {
        await fetch(`http://localhost:5000/approve-request/${id}`, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        });
        fetchRequests();
    } catch (error) {
        console.error("Error approving request:", error);
    }
}

</script>

</body>
</html>
