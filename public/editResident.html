<!DOCTYPE html>
<html>
<head>
<title>Edit Resident</title>
<link rel="stylesheet" href="style2.css">

<style>


/* COOL BACK BUTTON */
.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;

    background: linear-gradient(135deg, #0d47a1, #1565c0);
    color: white;

    border: none;
    padding: 8px 14px;
    border-radius: 6px;

    cursor: pointer;
    font-weight: 500;

    transition: all 0.3s ease;

    display: flex;
    align-items: center;
    gap: 6px;
}

/* HOVER */
.back-btn:hover {
    background: linear-gradient(135deg, #08306b, #0d47a1);
    transform: translateY(-1px);
}

/* CLICK */
.back-btn:active {
    transform: scale(0.97);
}

/* DARK MODE */
body.dark .back-btn {
    background: linear-gradient(135deg, #1a237e, #0d47a1);
}
/* DARK MODE */
body.dark {
    background: #1e1e2f;
    color: #f1f1f1;
}

body.dark .card {
    background: #2c2c3e;
}

body.dark input, 
body.dark select {
    background: #3a3a50;
    color: white;
    border: 1px solid #555;
}

/* FAMILY CARD */
.family-member {
    border: 1px solid #e0e6ed;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: #f9fbff;
    transition: all 0.3s ease;
}

.family-member:hover {
    transform: translateY(-2px);
}

body.dark .family-member {
    background: #2a2a3d;
}

/* LABEL */
.label {
    font-size: 12px;
    margin-bottom: 3px;
    display: block;
    opacity: 0.7;
}

/* 🔵 DARK BLUE BUTTON STYLE (UPDATED) */
button {
    background: linear-gradient(135deg, #0d47a1, #1565c0);
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}

/* HOVER EFFECT */
button:hover {
    background: linear-gradient(135deg, #08306b, #0d47a1);
    transform: translateY(-1px);
}

/* ACTIVE CLICK */
button:active {
    transform: scale(0.97);
}

/* REMOVE BUTTON (slightly different but still dark blue theme) */
.remove-btn {
    background: linear-gradient(135deg, #0b3c8c, #1a237e);
}

.remove-btn:hover {
    background: linear-gradient(135deg, #061a40, #0b2a6f);
}

/* DARK MODE BUTTON OVERRIDE */
body.dark button {
    background: linear-gradient(135deg, #0b3c8c, #1565c0);
}

body.dark .remove-btn {
    background: linear-gradient(135deg, #1a237e, #0d47a1);
}

/* TOGGLE BUTTON */
.toggle-dark {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #1565c0;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">⬅ Back</button>

<button class="toggle-dark" onclick="toggleDark()">🌙</button>

<div class="container">

<h1 class="title">Edit Resident</h1>

<div class="tabs">
    <button class="tab active" onclick="showTab('head', event)">Head Info</button>
    <button class="tab" onclick="showTab('family', event)">Family Members</button>
</div>

<!-- HEAD -->
<div id="headTab" class="card active">

<h3>HEAD INFORMATION</h3>

<div class="row">
    <input id="firstName" placeholder="First Name">
    <input id="middleName" placeholder="Middle Name">
    <input id="lastName" placeholder="Last Name">
</div>

<div class="row">
    <select id="gender">
        <option value="">Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <select id="civilStatus">
        <option value="">Civil Status</option>
        <option>Single</option>
        <option>Live-in</option>
        <option>Married</option>
        <option>Separated</option>
        <option>Widowed</option>
    </select>

    <input id="nationality" placeholder="Nationality">
</div>

<div class="row">
    <input type="date" id="birthdate">
    <input id="age" readonly placeholder="Age">
    <input id="contact" placeholder="Contact">
    <input id="email" placeholder="Email">
</div>

<div class="row">
    <select id="occupation">
        <option value="">Occupation</option>
        <option>Employed</option>
        <option>Student</option>
        <option>Unemployed</option>
        <option>Self-employed</option>
        <option>Out of School</option>
    </select>

    <input id="socialClass" placeholder="Social Class">
    <input id="religion" placeholder="Religion">
</div>

</div>

<!-- FAMILY -->
<div id="familyTab" class="card">

<h3>FAMILY MEMBERS</h3>

<div id="familyContainer"></div>

<button class="btn add" onclick="addFamilyMember()">+ Add Member</button>

</div>

<button class="btn save" onclick="saveChanges()">💾 Save Changes</button>

</div>

<script>

function goBack(){
    window.history.back();
}

const token = localStorage.getItem("token");
const id = new URLSearchParams(window.location.search).get("id");

/* TAB */
function showTab(tab,e){
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.getElementById(tab+"Tab").classList.add("active");
    e.target.classList.add("active");
}

/* LOAD */
async function loadData(){
    const res = await fetch(`http://localhost:5000/residents/${id}`);
    const data = await res.json();

    const head = data.head || {};

    // HEAD
    for(let key in head){
        if(document.getElementById(key)){
            document.getElementById(key).value = head[key] || "";
        }
    }

    // FAMILY
    const container = document.getElementById("familyContainer");
    container.innerHTML = "";

    (data.familyMembers || []).forEach(m=>addFamilyMember(m));
}

function addFamilyMember(data = {}) {
    const div = document.createElement("div");
    div.className = "family-member";

    div.innerHTML = `
    <div class="row">
        <input class="memberName" placeholder="Full Name" value="${data.name || ""}">
        <input class="memberRelation" placeholder="Relation" value="${data.relation || ""}">
    </div>

    <div class="row">
        <select class="memberGender">
            <option value="">Gender</option>
            <option ${data.gender === "Male" ? "selected" : ""}>Male</option>
            <option ${data.gender === "Female" ? "selected" : ""}>Female</option>
            <option ${data.gender === "Other" ? "selected" : ""}>Other</option>
        </select>

        <select class="memberCivilStatus">
            <option value="">Civil Status</option>
            <option ${data.civilStatus === "Single" ? "selected" : ""}>Single</option>
            <option ${data.civilStatus === "Live-in" ? "selected" : ""}>Live-in</option>
            <option ${data.civilStatus === "Married" ? "selected" : ""}>Married</option>
            <option ${data.civilStatus === "Separated" ? "selected" : ""}>Separated</option>
            <option ${data.civilStatus === "Widowed" ? "selected" : ""}>Widowed</option>
        </select>

        <input class="memberOccupation" placeholder="Occupation" value="${data.occupation || ""}">
    </div>

    <div class="row">
        <input type="date" class="memberBirthdate" value="${data.birthdate || ""}">
        <input class="memberAge" readonly placeholder="Age" value="${data.age || ""}">
    </div>

    <button class="remove-btn" onclick="this.closest('.family-member').remove()">Remove</button>
    `;

    document.getElementById("familyContainer").appendChild(div);
}

/* SAVE */
async function saveChanges(){

    const members = [];

document.querySelectorAll(".family-member").forEach(m => {
    members.push({
        name: m.querySelector(".memberName").value,
        relation: m.querySelector(".memberRelation").value,
        gender: m.querySelector(".memberGender").value,
        civilStatus: m.querySelector(".memberCivilStatus").value,
        occupation: m.querySelector(".memberOccupation").value,
        birthdate: m.querySelector(".memberBirthdate").value,
        age: m.querySelector(".memberAge").value
    });
});

    const updated = {
        head: {
            firstName: firstName.value,
            middleName: middleName.value,
            lastName: lastName.value,
            gender: gender.value,
            civilStatus: civilStatus.value,
            nationality: nationality.value,
            birthdate: birthdate.value,
            age: age.value,
            contact: contact.value,
            email: email.value,
            occupation: occupation.value,
            socialClass: socialClass.value,
            religion: religion.value
        },
        familyMembers: members
    };

    await fetch(`http://localhost:5000/residents/${id}`, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(updated)
    });

    alert("Saved successfully!");
}

/* AGE AUTO */
document.addEventListener("input",e=>{
    if(e.target.classList.contains("memberBirthdate")){
        const d=new Date(e.target.value);
        e.target.nextElementSibling.value=new Date().getFullYear()-d.getFullYear();
    }
});

/* DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("dark")=="true") document.body.classList.add("dark");

loadData();
</script>

</body>
</html>
