<!DOCTYPE html>
<html>
<head>
    <title>Edit Resident</title>
    <link rel="stylesheet" href="style2.css">

<style>
body.dark {
    background: #1e1e2f;
    color: #f1f1f1;
}

body.dark .card {
    background: #2c2c3e;
}

body.dark input,
body.dark select {
    background: #3a3a50;
    color: white;
    border: 1px solid #555;
}

.toggle-dark {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: #2c7be5;
    color: white;
}
</style>

</head>

<body>

<button class="toggle-dark" onclick="toggleDark()">🌙 Dark Mode</button>

<div class="container">

    <h1 class="title">Edit Resident</h1>

    <div class="tabs">
        <button class="tab active" onclick="showTab('head', event)">Head Info</button>
        <button class="tab" onclick="showTab('family', event)">Family Members</button>
    </div>

    <!-- HEAD -->
    <div id="headTab" class="card active">

        <h3>HEAD INFORMATION</h3>

        <div class="row">
            <input type="text" id="firstName" placeholder="First Name">
            <input type="text" id="middleName" placeholder="Middle Name">
            <input type="text" id="lastName" placeholder="Last Name">
        </div>

        <div class="row">
            <select id="gender">
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <select id="civilStatus">
                <option value="">Civil Status</option>
                <option>Single</option>
                <option>Live-in</option>
                <option>Married</option>
                <option>Separated</option>
                <option>Widowed</option>
            </select>

            <input type="text" id="nationality" placeholder="Nationality">
        </div>

        <div class="row">
            <input type="date" id="birthdate">
            <input type="number" id="age" readonly>
            <input type="text" id="contact" placeholder="Contact">
            <input type="email" id="email" placeholder="Email">
        </div>

        <div class="row">
            <select id="occupation">
                <option value="">Occupation</option>
                <option>Employed</option>
                <option>Student</option>
                <option>Unemployed</option>
                <option>Self-employed</option>
                <option>Out of School</option>
            </select>

            <input type="text" id="socialClass" placeholder="Social Class">
            <input type="text" id="religion" placeholder="Religion">
        </div>

    </div>

    <!-- FAMILY -->
    <div id="familyTab" class="card">

        <h3>FAMILY MEMBERS</h3>

        <div id="familyContainer"></div>

        <button class="btn add" onclick="addFamilyMember()">+ Add Member</button>
    </div>

    <button class="btn save" onclick="saveChanges()">💾 Save Changes</button>

</div>

<script>

const token = localStorage.getItem("token");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const sitio = params.get("sitio");

let residentData;

/* TAB */
function showTab(tab, e){
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    if(tab === 'head'){
        document.getElementById("headTab").classList.add("active");
    } else {
        document.getElementById("familyTab").classList.add("active");
    }

    e.target.classList.add("active");
}

/* LOAD */
async function loadData(){
    const res = await fetch(`http://localhost:5000/residents/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    residentData = await res.json();
    const head = residentData.head || {};

    // HEAD DATA
    document.getElementById("firstName").value = head.firstName || "";
    document.getElementById("middleName").value = head.middleName || "";
    document.getElementById("lastName").value = head.lastName || "";
    document.getElementById("birthdate").value = head.birthdate ? head.birthdate.split("T")[0] : "";
    document.getElementById("age").value = head.age || "";
    document.getElementById("gender").value = head.gender || "";
    document.getElementById("civilStatus").value = head.civilStatus || "";
    document.getElementById("nationality").value = head.nationality || "";
    document.getElementById("contact").value = head.contact || "";
    document.getElementById("email").value = head.email || "";
    document.getElementById("occupation").value = head.occupation || "";
    document.getElementById("socialClass").value = head.socialClass || "";
    document.getElementById("religion").value = head.religion || "";

    // FAMILY DATA
    const container = document.getElementById("familyContainer");
    container.innerHTML = "";

    (residentData.familyMembers || []).forEach(m => addFamilyMember(m));
}

/* SAVE */
async function saveChanges(){

    const members = [];
    document.querySelectorAll(".family-member").forEach(m => {
        members.push({
            name: m.querySelector(".memberName").value,
            relation: m.querySelector(".memberRelation").value,
            birthdate: m.querySelector(".memberBirthdate").value,
            age: m.querySelector(".memberAge").value
        });
    });

    const updated = {
        head: {
            firstName: document.getElementById("firstName").value,
            middleName: document.getElementById("middleName").value,
            lastName: document.getElementById("lastName").value,
            birthdate: document.getElementById("birthdate").value,
            age: document.getElementById("age").value,
            gender: document.getElementById("gender").value,
            civilStatus: document.getElementById("civilStatus").value,
            nationality: document.getElementById("nationality").value,
            contact: document.getElementById("contact").value,
            email: document.getElementById("email").value,
            occupation: document.getElementById("occupation").value,
            socialClass: document.getElementById("socialClass").value,
            religion: document.getElementById("religion").value
        },
        familyMembers: members
    };

    console.log("SENDING:", updated); // DEBUG

    await fetch(`http://localhost:5000/residents/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(updated)
    });

    alert("Updated successfully!");

window.location.href = "profile.html";
}

/* ADD */
function addFamilyMember(data = null){
    const div = document.createElement("div");
    div.classList.add("family-member");

    div.innerHTML = `
        <div class="row">
            <input type="text" class="memberName" placeholder="Full Name" value="${data?.name || ""}">
            <input type="text" class="memberRelation" placeholder="Relation" value="${data?.relation || ""}">
            <input type="date" class="memberBirthdate" value="${data?.birthdate || ""}">
            <input type="number" class="memberAge" placeholder="Age" readonly value="${data?.age || ""}">
            <button type="button" class="remove-btn" onclick="removeMember(this)">Remove</button>
        </div>
    `;

    document.getElementById("familyContainer").appendChild(div);
}

function removeMember(btn){
    btn.closest(".family-member").remove();
}

/* DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode") === "true"){
    document.body.classList.add("dark");
}

/* AGE */
document.getElementById("birthdate").addEventListener("change", function(){
    const b = new Date(this.value);
    const now = new Date();
    document.getElementById("age").value = now.getFullYear() - b.getFullYear();
});

document.addEventListener("input", function(e){
    if(e.target.classList.contains("memberBirthdate")){
        const birth = new Date(e.target.value);
        const now = new Date();
        e.target.nextElementSibling.value = now.getFullYear() - birth.getFullYear();
    }
});

loadData();
</script>

</body>
</html>
