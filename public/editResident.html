<!DOCTYPE html>
<html>
<head>
    <title>Edit Resident</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

<div class="container">

    <h1 class="title">Edit Resident</h1>

    <!-- NAV TABS -->
    <div class="tabs">
        <button class="tab active" onclick="showTab('head')">Head Info</button>
        <button class="tab" onclick="showTab('family')">Family Members</button>
    </div>

    <!-- HEAD INFO -->
    <div id="headTab" class="card active">

        <h3>HEAD INFORMATION</h3>

        <div class="grid">
            <input id="name" placeholder="Full Name">
            <input id="birthdate" type="date">
            <input id="age" type="number" readonly>

            <input id="gender" placeholder="Gender">
            <input id="civilStatus" placeholder="Civil Status">
            <input id="nationality" placeholder="Nationality">

            <input id="contact" placeholder="Contact">
            <input id="email" placeholder="Email">

            <input id="occupation" placeholder="Occupation">
            <input id="socialClass" placeholder="Social Class">
            <input id="religion" placeholder="Religion">
        </div>

    </div>

    <!-- FAMILY -->
    <div id="familyTab" class="card">

        <h3>FAMILY MEMBERS</h3>

        <div id="familyContainer"></div>

        <button class="btn add" onclick="addFamilyMember()">+ Add Member</button>
    </div>

    <!-- SAVE -->
    <button class="btn save" onclick="saveChanges()">💾 Save Changes</button>

</div>

<script>
const token = localStorage.getItem("token");

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const sitio = params.get("sitio");

let residentData;

/* TAB SWITCH */
function showTab(tab){
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    if(tab === 'head'){
        document.getElementById("headTab").classList.add("active");
    } else {
        document.getElementById("familyTab").classList.add("active");
    }

    event.target.classList.add("active");
}

/* LOAD */
async function loadData(){

    const res = await fetch(`http://localhost:5000/residents/${id}`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    residentData = await res.json();

    const head = residentData.head;

    Object.keys(head).forEach(key => {
        if(document.getElementById(key)){
            document.getElementById(key).value = head[key] || "";
        }
    });

    const container = document.getElementById("familyContainer");
    container.innerHTML = "";

    (residentData.familyMembers || []).forEach(m => addFamilyMember(m));
}

/* SAVE */
async function saveChanges(){

    const members = [];

    document.querySelectorAll(".family-member").forEach(m => {
        members.push({
            name: m.querySelector(".memberName").value,
            birthdate: m.querySelector(".memberBirthdate").value,
            age: m.querySelector(".memberAge").value,
            relation: m.querySelector(".memberRelation").value,
            occupation: m.querySelector(".memberOccupation").value
        });
    });

    const updated = {
        head: {
            name: document.getElementById("name").value,
            birthdate: document.getElementById("birthdate").value,
            age: document.getElementById("age").value,
            gender: document.getElementById("gender").value,
            civilStatus: document.getElementById("civilStatus").value,
            nationality: document.getElementById("nationality").value,
            contact: document.getElementById("contact").value,
            email: document.getElementById("email").value,
            occupation: document.getElementById("occupation").value,
            socialClass: document.getElementById("socialClass").value,
            religion: document.getElementById("religion").value
        },
        familyMembers: members
    };

    await fetch(`http://localhost:5000/residents/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(updated)
    });

    alert("Updated successfully!");
    window.location.href = `profile.html?id=${id}&sitio=${sitio}`;
}

/* ADD FAMILY */
function addFamilyMember(data = null){

    const div = document.createElement("div");
    div.classList.add("family-member");

    div.innerHTML = `
        <input class="memberName" placeholder="Name" value="${data?.name || ""}">
        <input type="date" class="memberBirthdate" value="${data?.birthdate || ""}">
        <input type="number" class="memberAge" readonly value="${data?.age || ""}">
        <input class="memberRelation" placeholder="Relation" value="${data?.relation || ""}">
        <input class="memberOccupation" placeholder="Occupation" value="${data?.occupation || ""}">
        <button class="remove" onclick="this.parentElement.remove()">✖</button>
    `;

    document.getElementById("familyContainer").appendChild(div);
}

/* AGE */
document.addEventListener("input", function(e){
    if(e.target.classList.contains("memberBirthdate")){
        const birth = new Date(e.target.value);
        const now = new Date();
        let age = now.getFullYear() - birth.getFullYear();
        e.target.nextElementSibling.value = age;
    }
});

document.getElementById("birthdate").addEventListener("change", function(){
    const b = new Date(this.value);
    const now = new Date();
    document.getElementById("age").value = now.getFullYear() - b.getFullYear();
});

loadData();
</script>

</body>
</html>
