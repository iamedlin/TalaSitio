<!DOCTYPE html>
<html>
<head>
    <title>Add Household</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="form-wrapper">

    <form id="residentForm" class="form-card">

        <h2 class="section-title">USER INFORMATION</h2>

        <!-- NAME -->
        <div class="row">
            <div class="input-group">
                <label>First Name *</label>
                <input type="text" id="firstName" required>
            </div>

            <div class="input-group">
                <label>Middle Name *</label>
                <input type="text" id="middleName" required>
            </div>

            <div class="input-group">
                <label>Last Name *</label>
                <input type="text" id="lastName" required>
            </div>
        </div>

        <!-- GENDER + STATUS -->
        <div class="row">
            <div class="input-group">
                <label>Gender *</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Civil Status *</label>
                <select id="civilStatus" required>
                    <option value="">Select</option>
                    <option>Single</option>
                    <option>Live-in</option>
                    <option>Married</option>
                    <option>Widowed</option>
                    <option>Separated</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nationality *</label>
                <input type="text" id="nationality" required>
            </div>
        </div>

        <!-- BIRTHDATE + AGE -->
        <div class="row">
            <div class="input-group">
                <label>Birthdate *</label>
                <input type="date" id="birthdate" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" id="age" readonly>
            </div>

            <div class="input-group">
                <label>Contact Number *</label>
                <input type="text" id="contact" required>
            </div>
                <div class="input-group">
        <label>Email *</label>
        <input type="email" id="email" required>
    </div>
        </div>

        <!-- OTHER INFO -->
        <div class="row">
            <div class="input-group">
                <label>Occupation *</label>
                <select id="occupation" required>
                    <option value="">Select</option>
                    <option>Employed</option>
                    <option>Student</option>
                    <option>Out of School</option>
                    <option>Unemployed</option>
                    <option>Self-employed</option>
                    <option>Retired</option>
                </select>
            </div>

            <div class="input-group">
                <label>Social Class *</label>
                <input type="text" id="socialClass" required>
            </div>

            <div class="input-group">
                <label>Religion *</label>
                <input type="text" id="religion" required>
            </div>
        </div>

        <h2 class="section-title">FAMILY MEMBERS</h2>

        <div id="familyContainer"></div>

        <button type="button" class="add-btn" onclick="addFamilyMember()">+ Add Member</button>

        <button type="submit" class="save-btn">SAVE INFORMATION</button>

    </form>
</div>

<script>
const token = localStorage.getItem("token");

/* AUTO COMPUTE AGE */
document.getElementById("birthdate").addEventListener("change", function () {
    const birthdate = new Date(this.value);
    const today = new Date();

    let age = today.getFullYear() - birthdate.getFullYear();
    const m = today.getMonth() - birthdate.getMonth();

    if (m < 0 || (m === 0 && today.getDate() < birthdate.getDate())) {
        age--;
    }

    document.getElementById("age").value = age;
});

/* ADD FAMILY MEMBER */
function addFamilyMember(){
    const div = document.createElement("div");
    div.classList.add("family-member");

    div.innerHTML = `
        <h3>Family Member</h3>

        <div class="row">
            <div class="input-group">
                <label>First Name *</label>
                <input type="text" class="memberFirst" required>
            </div>

            <div class="input-group">
                <label>Middle Name *</label>
                <input type="text" class="memberMiddle" required>
            </div>

            <div class="input-group">
                <label>Last Name *</label>
                <input type="text" class="memberLast" required>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Birthdate *</label>
                <input type="date" class="memberBirthdate" required>
            </div>

            <div class="input-group">
                <label>Age</label>
                <input type="number" class="memberAge" readonly>
            </div>

            <div class="input-group">
                <label>Gender *</label>
                <select class="memberGender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Relation *</label>
                <input type="text" class="memberRelation" placeholder="Son, Wife..." required>
            </div>

            <div class="input-group">
                <label>Civil Status *</label>
                <select class="memberCivilStatus" required>
                    <option value="">Select</option>
                    <option>Single</option>
                    <option>Live-in</option>
                    <option>Married</option>
                    <option>Widowed</option>
                    <option>Separated</option>
                </select>
            </div>

          <div class="input-group">
                <label>Occupation *</label>
                <select id="memberoccupation" required>
                    <option value="">Select</option>
                    <option>Employed</option>
                    <option>Student</option>
                    <option>Out of School</option>
                    <option>Unemployed</option>
                    <option>Self-employed</option>
                    <option>Retired</option>
                </select>
            </div>
        </div>

        <button type="button" class="removeBtn">❌ Remove</button>
        <hr>
    `;

    document.getElementById("familyContainer").appendChild(div);

    /* AUTO AGE FOR EACH MEMBER */
    div.querySelector(".memberBirthdate").addEventListener("change", function () {
        const birthdate = new Date(this.value);
        const today = new Date();

        let age = today.getFullYear() - birthdate.getFullYear();
        const m = today.getMonth() - birthdate.getMonth();

        if (m < 0 || (m === 0 && today.getDate() < birthdate.getDate())) {
            age--;
        }

        div.querySelector(".memberAge").value = age;
    });

    /* REMOVE BUTTON */
    div.querySelector(".removeBtn").addEventListener("click", function () {
        div.remove();
    });
}

/* SUBMIT */
document.getElementById("residentForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const members = [];

    document.querySelectorAll(".family-member").forEach(m => {
        members.push({
            name: `${m.querySelector(".memberFirst").value} ${m.querySelector(".memberMiddle").value} ${m.querySelector(".memberLast").value}`,
            birthdate: m.querySelector(".memberBirthdate").value,
            age: m.querySelector(".memberAge").value,
            relation: m.querySelector(".memberRelation").value,
            occupation: m.querySelector(".memberOccupation").value
        });
    });

    const fullName = `${document.getElementById("firstName").value} ${document.getElementById("middleName").value} ${document.getElementById("lastName").value}`;

    const data = {
        head: {
            name: fullName,
            birthdate: document.getElementById("birthdate").value,
            age: document.getElementById("age").value,
            gender: document.getElementById("gender").value,
            civilStatus: document.getElementById("civilStatus").value,
            contact: document.getElementById("contact").value,
            email: document.getElementById("email").value,
            occupation: document.getElementById("occupation").value,
            socialClass: document.getElementById("socialClass").value,
            religion: document.getElementById("religion").value,
            nationality: document.getElementById("nationality").value
        },
        familyMembers: members,
        sitio: "1"
    };

    try {
        await fetch("http://localhost:5000/residents", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(data)
        });

        alert("Saved successfully!");
        window.location.href = "sitio1.html";

    } catch(err){
        console.error(err);
    }
});
</script>

</body>
</html>
