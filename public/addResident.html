<!DOCTYPE html>
<html>
<head>
    <title>Add Household</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="form-wrapper">

    <form id="residentForm" class="form-card">

        <h2 class="section-title">USER INFORMATION</h2>

        <!-- NAME -->
        <div class="row">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="middleName" placeholder="Middle Name" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
        </div>

        <!-- INFO -->
        <div class="row">
            <select id="gender" required>
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <select id="civilStatus" required>
                <option value="">Civil Status</option>
                <option>Single</option>
                <option>Married</option>
            </select>

            <input type="text" id="nationality" placeholder="Nationality" required>
        </div>

        <!-- BIRTH -->
        <div class="row">
            <input type="date" id="birthdate" required>
            <input type="number" id="age" readonly>
            <input type="text" id="contact" placeholder="Contact" required>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <!-- OTHER -->
        <div class="row">
            <select id="occupation" required>
                <option value="">Occupation</option>
                <option>Employed</option>
                <option>Student</option>
                <option>Unemployed</option>
            </select>

            <input type="text" id="socialClass" placeholder="Social Class" required>
            <input type="text" id="religion" placeholder="Religion" required>
        </div>

        <h2 class="section-title">FAMILY MEMBERS</h2>

        <div id="familyContainer"></div>

        <button type="button" onclick="addFamilyMember()">+ Add Member</button>

        <button type="submit">SAVE</button>

    </form>
</div>

<script>

const token = localStorage.getItem("token");

/* ✅ FIX: GET SITIO FROM STORAGE */
let sitioId = Number(localStorage.getItem("sitioId"));

if (!sitioId) {
    alert("No sitio selected!");
    window.location.href = "sitio.html";
}

/* AUTO AGE */
document.getElementById("birthdate").addEventListener("change", function () {

    const birthdate = new Date(this.value);
    const today = new Date();

    let age = today.getFullYear() - birthdate.getFullYear();

    const m = today.getMonth() - birthdate.getMonth();

    if (m < 0 || (m === 0 && today.getDate() < birthdate.getDate())) {
        age--;
    }

    document.getElementById("age").value = age;
});

/* ADD FAMILY */
function addFamilyMember(){

    const div = document.createElement("div");

    div.innerHTML = `
        <input type="text" class="memberName" placeholder="Name" required>
        <input type="date" class="memberBirthdate" required>
        <input type="number" class="memberAge" readonly>
        <input type="text" class="memberRelation" placeholder="Relation" required>
        <button type="button" onclick="this.parentElement.remove()">Remove</button>
        <hr>
    `;

    document.getElementById("familyContainer").appendChild(div);

    div.querySelector(".memberBirthdate").addEventListener("change", function () {

        const birthdate = new Date(this.value);
        const today = new Date();

        let age = today.getFullYear() - birthdate.getFullYear();

        const m = today.getMonth() - birthdate.getMonth();

        if (m < 0 || (m === 0 && today.getDate() < birthdate.getDate())) {
            age--;
        }

        div.querySelector(".memberAge").value = age;
    });
}

/* SUBMIT */
document.getElementById("residentForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const members = [];

    document.querySelectorAll(".memberName").forEach((el, i) => {

        members.push({
            name: el.value,
            birthdate: document.querySelectorAll(".memberBirthdate")[i].value,
            age: Number(document.querySelectorAll(".memberAge")[i].value),
            relation: document.querySelectorAll(".memberRelation")[i].value
        });

    });

    const data = {
        head: {
            name: `${firstName.value} ${middleName.value} ${lastName.value}`,
            birthdate: birthdate.value,
            age: Number(age.value),
            gender: gender.value,
            civilStatus: civilStatus.value,
            contact: contact.value,
            email: email.value,
            occupation: occupation.value,
            socialClass: socialClass.value,
            religion: religion.value,
            nationality: nationality.value
        },
        familyMembers: members,
        sitio: sitioId // ✅ FIXED
    };

    console.log("SENDING:", data);

    await fetch("http://localhost:5000/residents", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(data)
    });

    alert("Saved!");

    /* BACK TO CORRECT SITIO */
    window.location.href = `sitio.html?sitio=${sitioId}`;
});

</script>

</body>
</html>
